name: CI — PR a dev

on:
  pull_request:
    branches: [dev]

jobs:
  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Auditar dependencias (ignorar uuid GHSA-w5hq-g745-h8pq)
        run: |
          npm audit --audit-level=moderate --json > audit.json || true
          VULN=$(node -e "
            const r = require('./audit.json');
            const vs = r.vulnerabilities || {};
            const real = Object.keys(vs).filter(k => {
              const v = vs[k];
              return !(k === 'uuid' || k === 'sequelize');
            });
            if (real.length) { console.log('Vulnerabilidades encontradas:', real.join(', ')); process.exit(1); }
            console.log('Audit OK (uuid ignorado)');
          ")
          echo "$VULN"

  lint:
    name: Análisis de seguridad (ESLint)
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:security

  unit-tests:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    needs: audit
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit
