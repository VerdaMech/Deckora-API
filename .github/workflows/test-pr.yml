name: CI — PR a dev

on:
  pull_request:
    branches: [dev]

jobs:
  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: deckora-api/package-lock.json
      - run: npm ci
        working-directory: deckora-api
      - run: npm audit --audit-level=moderate
        working-directory: deckora-api

  lint:
    name: Análisis de seguridad (ESLint)
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: deckora-api/package-lock.json
      - run: npm ci
        working-directory: deckora-api
      - run: npm run lint:security
        working-directory: deckora-api

  unit-tests:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    needs: audit
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: deckora-api/package-lock.json
      - run: npm ci
        working-directory: deckora-api
      - run: npm run test:unit
        working-directory: deckora-api
